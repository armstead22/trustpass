# =====================================================================
# TrustPass — full stack (Postgres + Redis + app)
# Usage:  docker compose up --build
# The demo app also runs standalone on SQLite (npm run dev) without Docker.
# =====================================================================
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trustpass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: trustpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Point the app at Postgres + Redis when wiring the prod data layer.
      DATABASE_URL: postgresql://trustpass:${POSTGRES_PASSWORD:-change-me}@postgres:5432/trustpass
      REDIS_URL: redis://redis:6379
    ports:
      - "5000:5000"

volumes:
  pgdata:
  redisdata:
